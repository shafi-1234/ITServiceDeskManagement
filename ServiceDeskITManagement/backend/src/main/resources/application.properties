server.port=1414

spring.application.name=it-service-desk

# Google OAuth 2.0 (set these as environment variables or replace the placeholders)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# H2 file DB for local dev. For MySQL, override these via env vars.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.frontend-url=${FRONTEND_URL}
# Comma-separated Google emails that get the ADMIN role
app.admin-emails=${ADMIN_EMAILS:}


# Show error messages (e.g. "Username already taken") to the frontend
server.error.include-message=always

# Optional: create a username/password admin at startup (password must be 8+ chars)
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USER:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@servicedesk.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
